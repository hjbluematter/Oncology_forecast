services:
  # ── Backend — Node.js API ──────────────────────────────────────────────────
  - type: web
    name: oncocast-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: PORT
        value: 3001
      - key: MONGODB_URI
        sync: false   # set manually in Render dashboard
      - key: MONGODB_DB
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false   # set to https://oncocast.onrender.com after frontend deploys

  # ── Frontend — React/Vite static site ────────────────────────────────────
  - type: web
    name: oncocast
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    plan: free
    envVars:
      - key: VITE_API_URL
        sync: false   # set to https://oncocast-api.onrender.com/api after backend deploys
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
